name: CI Build Dev
run-name: Build project by ${{ github.actor }}

on:
  push:
    branches:
      - master
      - mg-ci
      - mg-ci-22.04

  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
      - mg-ci

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  packages: write

jobs:
  build_linux:
    name: Build for Linux
    runs-on: [ ubuntu-22.04 ]

    env:
      install_prefix: '${{ github.workspace }}/install_dir_linux'

    steps:
      - name: Prepare dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y --no-install-suggests --no-install-recommends \
            ant autoconf automake autopoint bison cmake flex g++ gettext \
            git git-core libasound2-dev libavahi-client-dev libcdio-dev libdbus-1-dev \
            libdirectfb-dev libegl1-mesa-dev libfreetype6-dev libfribidi-dev \
            libgles2-mesa-dev libgnutls28-dev libgtk2.0-dev libidn11-dev libjack-dev \
            liblircclient-dev libltdl-dev liblua5.2-dev libmtp-dev libncursesw5-dev \
            libpng-dev libpulse-dev librsvg2-dev \
            libsecret-1-dev libtool libtool-bin libudev-dev libupnp-dev libv4l-dev \
            libva-dev libvdpau-dev libx11-dev libxcb-composite0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xv0-dev libxcb1-dev \
            libxext-dev libxi-dev libxinerama-dev libxml2-dev libxpm-dev libzvbi-dev \
            locales lua5.2 make pkg-config p7zip-full wget \
            vim xz-utils yasm zlib1g-dev libxkbcommon-x11-dev meson \
            curl build-essential python3-venv python3-pip python3-setuptools python3-mako python3-wheel \
            nasm clang libvulkan-dev \
            gnupg1 ca-certificates lftp openjdk-11-jdk \
            wayland-protocols libva-wayland2 \
            ffmpeg libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libpostproc-dev libswresample-dev libswscale-dev \
            rustc cargo \
            curl jq squashfs-tools snapd libgcrypt20-dev libsystemd-dev libxcb-damage0-dev gperf \
            && \
          pip3 install meson ninja && \
          sudo locale-gen en_US.UTF-8 && \
          sudo /usr/sbin/update-locale LANG=en_US.UTF-8

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Bootstrap
        run: ./bootstrap

      - name: Configuration
        run: |
          ./configure --prefix=${{ env.install_prefix }} \
          --disable-srt --disable-lua --enable-merge-ffmpeg \
          --disable-shout --disable-qt --disable-nls --enable-pdb --disable-skins2

      - name: Build
        run: make -j2

      - name: Install
        run: make install

      - name: 'Tar files (to preserve symlinks)'
        run: tar -cvf vlc.tar -C ${{ env.install_prefix }} .

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libvlc4-linux
          path: vlc.tar

  build_windows:
    name: Build for Windows
    runs-on: [ ubuntu-24.04 ]
    if: false

    container:
      image: 'registry.videolan.org/vlc-debian-llvm-msvcrt:20221214101739'
      options: '--user root'

    env:
      CONFIGFLAGS: '--disable-vlm --disable-vlc --disable-chromecast --disable-goom --disable-libcddb --disable-shout --disable-sout'
      CONTRIBFLAGS: '--disable-qt --disable-sout --disable-sout --disable-medialibrary --disable-cddb --disable-chromaprint --disable-microdns --disable-vnc --disable-aribb25 --disable-libplacebo'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build
        run: ./extras/package/win32/build.sh -a x86_64 -z -x -i u

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libvlc4-windows
          path: ./win64/vlc-4.0.0-dev

  build_macos:
    name: Build for MacOS
    runs-on: [ macos-13 ]
    if: false

    strategy:
      matrix:
        arch: [x86_64, aarch64]

    env:

      CONTRIBFLAGS: --disable-qt --disable-sout --disable-medialibrary --disable-cddb --disable-chromaprint --disable-microdns --disable-vnc --disable-x265 --disable-shout --disable-rav1e --disable-vpx --disable-x264 --disable-x262 --disable-aom --disable-twolame --disable-librist --disable-ncurses --disable-fluid --disable-aribb25 --disable-xcb --disable-asdcplib --disable-protobuf --enable-gnutls --enable-gpg-error --enable-libtasn1 --enable-harfbuzz --enable-iconv --enable-png --enable-regex --enable-nettle
      VLC_CONFIGURE_ARGS: --disable-macosx --disable-sparkle --disable-osx-notifications  --disable-sout --disable-shout --disable-ncurses --disable-twolame --disable-vlm --disable-vlc --disable-nls --disable-chromecast --disable-dc1394 --disable-dv1394 --disable-aribb25
      VLC_PATH: /usr/local/bin
      #don't import pkg from homebrew
      PKG_CONFIG_LIBDIR: /usr/lib/pkgconfig

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install build tools
        run: |
          brew install help2man automake autoconf-archive libtool bison@3.8 nasm ragel meson python python-setuptools
          export BREW_PREFIX="$(brew --prefix)"
          echo "${BREW_PREFIX}/opt/bison/bin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/libtool/libexec/gnubin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/m4/bin" >> $GITHUB_PATH
          brew uninstall selenium-server composer kotlin geckodriver azure-cli aria2 gradle php aws-sam-cli maven
          brew autoremove

      - name: Build
        shell: bash
        run: ./extras/package/macosx/build.sh -a ${{matrix.arch}} -i s -c

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libvlc4-macos-${{matrix.arch}}
          #tarball is already compressed
          compression-level: 0
          path: ./vlc-macos-sdk-4.0.0-dev.tar.gz

  build_macos_universal:
    name: Build for MacOS (universal)
    runs-on: [ macos-13 ]
    needs: [ build_macos ]
    if: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Get Artifact (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: libvlc4-macos-aarch64
          path: ./artifacts/aarch64

      - name: Get Artifact (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: libvlc4-macos-x86_64
          path: ./artifacts/x86_64

      - name: Debug
        shell: bash
        run: find .

      - name: Build
        run: .github/workflows/osx_package.sh

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libvlc4-macos-universal
          path: ./vlc-macos-sdk-4.0.0-universal-dev.tar.gz
